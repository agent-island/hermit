title: "Hermit — Autonomous AI Agent Framework"
# No site-level description on purpose: jekyll-seo-tag appends it to the homepage
# <title>. The meta description lives per-page in index.md instead.
url: "https://agent-island.github.io"
baseurl: "/hermit"
lang: en
author: "Menghang Zhu"
github:
  repository_url: "https://github.com/agent-island/hermit"
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - "*.mjs"
  - package.json
  - package-lock.json
  - .env.example
  - test
  - scripts
  - extension
  - site
  - .github
  - Gemfile
  - Gemfile.lock
